<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World ID Verification</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 420px;
      width: 100%;
      max-height: calc(100vh - 32px);
      max-height: calc(100dvh - 32px);
      overflow-y: auto;
      padding: 24px 20px;
      text-align: center;
    }
    
    @media (max-height: 400px) {
      .container {
        padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      }
      h1 {
        font-size: 20px;
        margin-bottom: 6px;
      }
      .subtitle {
        font-size: 13px;
        margin-bottom: 12px;
      }
      #status {
        padding: 10px;
        margin-bottom: 12px;
        font-size: 12px;
      }
      .button {
        padding: 10px 20px;
        font-size: 14px;
        margin-top: 10px;
      }
      #qrCode {
        max-width: 160px;
        max-height: 160px;
      }
      #connectorLink {
        font-size: 12px;
        padding: 8px 16px;
        margin-top: 8px;
      }
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: #718096;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    #status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      line-height: 1.5;
    }
    #status.loading {
      background: #edf2f7;
      color: #4a5568;
    }
    #status.error {
      background: #fed7d7;
      color: #c53030;
    }
    #status.success {
      background: #c6f6d5;
      color: #22543d;
    }
    #status.warning {
      background: #fefcbf;
      color: #744210;
    }
    .button {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      margin-top: 12px;
    }
    .button:hover {
      background: #5a67d8;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    .button:disabled {
      background: #cbd5e0;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .info {
      font-size: 12px;
      color: #a0aec0;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
    }
    .spinner {
      border: 3px solid #e2e8f0;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 1s linear infinite;
      margin: 12px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .hidden {
      display: none;
    }
    #connectorDisplay {
      margin: 16px 0;
    }
    #qrCode {
      margin: 0 auto 12px;
      display: inline-block;
      padding: 8px;
      background: white;
      border-radius: 8px;
      max-width: 100%;
    }
    #qrCode canvas {
      display: block;
      max-width: 100%;
      height: auto;
      width: auto;
    }
    .qr-instruction {
      margin-bottom: 8px;
      font-size: 13px;
      color: #4a5568;
      font-weight: 600;
    }
    .connector-link {
      display: inline-block;
      padding: 10px 20px;
      background: #667eea;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      margin-top: 8px;
      transition: all 0.2s;
    }
    .connector-link:hover {
      background: #5a67d8;
      transform: translateY(-1px);
    }
    
    @media (max-width: 480px) {
      body {
        padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      }
      .container {
        padding: max(14px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
        max-height: calc(100vh - 24px);
        max-height: calc(100dvh - 24px);
      }
      h1 {
        font-size: 22px;
      }
      .subtitle {
        font-size: 13px;
        margin-bottom: 16px;
      }
      #status {
        padding: 10px;
        font-size: 12px;
        margin-bottom: 12px;
      }
      .spinner {
        width: 28px;
        height: 28px;
      }
      .info {
        font-size: 11px;
        margin-top: 12px;
        padding-top: 12px;
      }
    }
    
    @media (max-height: 700px) {
      .container {
        padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      }
      h1 {
        font-size: 22px;
        margin-bottom: 6px;
      }
      .subtitle {
        font-size: 13px;
        margin-bottom: 16px;
      }
      #status {
        margin-bottom: 12px;
        padding: 10px;
      }
      #connectorDisplay {
        margin: 12px 0;
      }
      #qrCode {
        margin-bottom: 8px;
        padding: 6px;
      }
      .qr-instruction {
        font-size: 12px;
        margin-bottom: 6px;
      }
      .connector-link {
        padding: 8px 16px;
        font-size: 12px;
        margin-top: 6px;
      }
      .info {
        margin-top: 12px;
        padding-top: 12px;
        font-size: 11px;
      }
    }
    
    @media (max-height: 580px) {
      .container {
        padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      }
      h1 {
        font-size: 20px;
        margin-bottom: 4px;
      }
      .subtitle {
        font-size: 12px;
        margin-bottom: 12px;
      }
      #status {
        padding: 8px;
        font-size: 11px;
        margin-bottom: 10px;
      }
      .spinner {
        width: 24px;
        height: 24px;
        margin: 8px auto;
      }
      #connectorDisplay {
        margin: 10px 0;
      }
      #qrCode {
        padding: 4px;
        margin-bottom: 6px;
      }
      .qr-instruction {
        font-size: 11px;
        margin-bottom: 4px;
      }
      .connector-link {
        padding: 6px 14px;
        font-size: 11px;
        margin-top: 4px;
      }
      .button {
        padding: 10px 20px;
        font-size: 14px;
      }
      .info {
        font-size: 10px;
        margin-top: 10px;
        padding-top: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>World ID Verification</h1>
    <p class="subtitle">Verify your unique personhood to access this Telegram group</p>
    
    <div id="status" class="loading">
      <div class="spinner"></div>
      Loading verification session...
    </div>
    
    <div id="connectorDisplay" class="hidden">
      <div id="qrCode"></div>
      <p class="qr-instruction">
        Scan QR code with World App
      </p>
      <a id="connectorLink" href="#" target="_blank" class="connector-link">
        Or tap to open on this device
      </a>
    </div>
    
    <button id="verifyButton" class="button hidden" disabled>
      Connect World App
    </button>
    
    <div class="info">
      <strong>Privacy:</strong> Only a zero-knowledge proof is verified. Our service receives no raw biometric data.
    </div>
  </div>

  <!-- Load Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <script type="module">
    // NO SECRETS IN CLIENT CODE
    // Configuration injected via URL params and Telegram WebApp context
    
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('session');
    
    const statusEl = document.getElementById('status');
    const buttonEl = document.getElementById('verifyButton');
    
    // Check for Telegram WebApp SDK (must be loaded before use)
    if (typeof window.Telegram === 'undefined' || !window.Telegram.WebApp) {
      showError('Telegram WebApp SDK failed to load. Please open this page in Telegram.');
      throw new Error('Telegram WebApp SDK not loaded');
    }
    
    // Check for Telegram Mini App context (required for authentication)
    const telegramWebApp = window.Telegram.WebApp;
    const initData = telegramWebApp.initData;
    
    function showStatus(message, type = 'loading') {
      statusEl.className = type;
      
      // SECURITY: Use textContent to prevent XSS, not innerHTML
      statusEl.textContent = '';
      
      if (type === 'loading') {
        const spinner = document.createElement('div');
        spinner.className = 'spinner';
        statusEl.appendChild(spinner);
      }
      
      const text = document.createTextNode(message);
      statusEl.appendChild(text);
    }
    
    function showError(message) {
      showStatus(message, 'error');
      buttonEl.classList.add('hidden');
    }
    
    function showSuccess(message) {
      showStatus(message, 'success');
      buttonEl.classList.add('hidden');
    }
    
    function showWarning(message) {
      showStatus(message, 'warning');
      buttonEl.classList.add('hidden');
    }
    
    async function initializeSession() {
      if (!sessionId) {
        showError('Invalid verification link. Please request a new one from the bot.');
        return;
      }
      
      // SECURITY: Require Telegram Mini App context (fail-closed)
      if (!initData) {
        showWarning('⚠️ This page must be opened from the Telegram bot. Verification is disabled in external browsers for security. Please open the link in Telegram.');
        return;
      }
      
      try {
        // Fetch session configuration from backend
        const response = await fetch(`/api/enrollment/session/${sessionId}`);
        
        if (!response.ok) {
          if (response.status === 404) {
            showError('Verification session not found or expired. Please request a new one.');
          } else if (response.status === 410) {
            showError('This verification session has already been used.');
          } else {
            showError('Unable to load verification session. Please try again.');
          }
          return;
        }
        
        const session = await response.json();
        
        // Validate session data
        if (!session.signedChallenge || !session.signedChallenge.action || !session.signedChallenge.nonce) {
          showError('Invalid session configuration.');
          return;
        }
        
        // Display ready state
        showStatus('Ready to verify with World App', 'success');
        buttonEl.classList.remove('hidden');
        buttonEl.disabled = false;
        
        // Store session for verification
        window.enrollmentSession = session;
        
        // Set up verification handler
        buttonEl.onclick = handleVerification;
        
      } catch (error) {
        console.error('Session initialization error:', error);
        showError('Network error. Please check your connection and try again.');
      }
    }
    
    /**
     * Generate standards-compliant QR code using bundled qrcode library
     * Responsive sizing based on viewport constraints
     * 
     * @param text - Data to encode (connectorURI)
     * @param container - DOM element to render into
     */
    async function generateQRCode(text, container) {
      try {
        // Import locally bundled qrcode library
        const { QRCode } = await import('/qrcode-bundle.js');
        
        // Calculate responsive QR size based on viewport
        const viewportHeight = window.innerHeight;
        const viewportWidth = window.innerWidth;
        const containerWidth = Math.min(viewportWidth - 80, 420);
        
        let qrSize;
        if (viewportHeight < 580) {
          // Very short viewports: minimal but scannable
          qrSize = Math.min(160, containerWidth - 40);
        } else if (viewportHeight < 700) {
          // Short viewports: compact
          qrSize = Math.min(200, containerWidth - 40);
        } else if (viewportWidth < 480) {
          // Mobile portrait: medium
          qrSize = Math.min(240, containerWidth - 40);
        } else {
          // Desktop/tablet: full size
          qrSize = Math.min(280, containerWidth - 40);
        }
        
        // Ensure minimum scannable size
        qrSize = Math.max(140, qrSize);
        
        // Generate standards-compliant QR code
        // Settings per ISO/IEC 18004 standard:
        // - Error correction: M (15% recovery)
        // - Margin: 4 modules (standard quiet zone)
        // - Scale: 8 pixels per module (high resolution)
        const canvas = document.createElement('canvas');
        
        await QRCode.toCanvas(canvas, text, {
          errorCorrectionLevel: 'M',
          margin: 4,
          scale: 8,
          width: qrSize,
          color: {
            dark: '#1a202c',
            light: '#ffffff'
          }
        });
        
        container.innerHTML = '';
        container.appendChild(canvas);
      } catch (error) {
        console.error('QR generation failed:', error);
        // Fallback: show clickable URL
        container.innerHTML = `<div style="padding: 16px; background: #f7fafc; border-radius: 8px;"><a href="${text}" target="_blank" style="color: #667eea; text-decoration: none; font-size: 13px; font-weight: 600;">Open World App on this device</a></div>`;
      }
    }
    
    // Expose generateQRCode for testing
    window.generateQRCode = generateQRCode;

    async function handleVerification() {
      const session = window.enrollmentSession;
      if (!session) {
        showError('Session expired. Please request a new verification link.');
        return;
      }
      
      if (!initData) {
        showError('Telegram authentication required. Please open from the bot.');
        return;
      }
      
      buttonEl.disabled = true;
      showStatus('Connecting to World App...', 'loading');
      
      try {
        // Import locally bundled IDKit Core SDK (from installed @worldcoin/idkit-core)
        const { IDKit, proofOfHuman } = await import('/idkit-bundle.js');
        
        // Validate required fields from session (fail-closed, no synthetic fallbacks)
        if (!session.rpId) {
          showError('Invalid session: missing RP ID. Please request a new verification.');
          return;
        }
        if (!session.signedChallenge.nonce) {
          showError('Invalid session: missing nonce. Please request a new verification.');
          return;
        }
        if (!session.signedChallenge.createdAt) {
          showError('Invalid session: missing timestamp. Please request a new verification.');
          return;
        }
        if (!session.signedChallenge.expiresAt) {
          showError('Invalid session: missing expiry. Please request a new verification.');
          return;
        }
        if (!session.signedChallenge.signature) {
          showError('Invalid session: missing signature. Please request a new verification.');
          return;
        }
        
        // Extract RP context from session (signed by backend, no fallbacks)
        const rp_context = {
          rp_id: session.rpId,
          nonce: session.signedChallenge.nonce,
          created_at: session.signedChallenge.createdAt,
          expires_at: session.signedChallenge.expiresAt,
          signature: session.signedChallenge.signature,
        };
        
        // Create verification request using official IDKit API
        const request = await IDKit.request({
          app_id: session.appId,
          action: session.signedChallenge.action,
          rp_context: rp_context,
          allow_legacy_proofs: true,
        }).preset(proofOfHuman({ signal: session.signal }));
        
        // CRITICAL: Display connectorURI in tappable DOM element BEFORE polling
        if (!request.connectorURI) {
          showError('Failed to generate World App connection. Please try again.');
          buttonEl.disabled = false;
          return;
        }
        
        // Display connectorURI as QR code and link
        const connectorDisplay = document.getElementById('connectorDisplay');
        const connectorLink = document.getElementById('connectorLink');
        const qrCodeEl = document.getElementById('qrCode');
        
        // Generate QR code from connectorURI
        await generateQRCode(request.connectorURI, qrCodeEl);
        
        connectorLink.href = request.connectorURI;
        connectorDisplay.classList.remove('hidden');
        
        showStatus('Scan QR code with World App on your phone', 'success');
        buttonEl.classList.add('hidden');
        
        // Poll for completion (user taps link in parallel)
        const result = await request.pollUntilCompletion({
          pollInterval: 2000,
          timeout: 300000, // 5 minutes
        });
        
        if (result.success) {
          await handleProofReceived(result.result);
        } else {
          handleProofError(result.error);
        }
        
      } catch (error) {
        console.error('Verification error:', error);
        showError('Unable to connect to World App. Please try again.');
        buttonEl.disabled = false;
      }
    }
    
    async function handleProofReceived(result) {
      showStatus('Submitting proof for verification...', 'loading');
      
      try {
        // SECURITY: Send both initData and proof for same-requester binding
        const response = await fetch('/api/enrollment/complete', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            initData: initData,
            idkitResult: result,
          }),
        });
        
        const data = await response.json();
        
        if (response.ok && data.success) {
          showSuccess(`✓ Verification successful! You can now return to Telegram. Your enrollment expires ${formatExpiry(data.expiresAt)}.`);
        } else {
          // SECURITY: Use textContent for error messages to prevent XSS
          const errorMsg = data.error || 'Verification failed. Please try again.';
          showError(errorMsg);
          buttonEl.disabled = false;
        }
        
      } catch (error) {
        console.error('Proof submission error:', error);
        showError('Network error while submitting proof. Please try again.');
        buttonEl.disabled = false;
      }
    }
    
    function handleProofError(errorCode) {
      console.error('World App error:', errorCode);
      let message = 'World App verification failed. Please try again.';
      let category = 'generic';
      
      // Map error codes to user-friendly messages
      // Based on https://docs.world.org/world-id/idkit/error-codes.md
      
      // User-initiated cancellation
      if (errorCode === 'user_rejected') {
        message = 'Verification was cancelled. Please try again when ready.';
        category = 'user_cancelled';
      } else if (errorCode === 'verification_rejected') {
        message = 'Verification was rejected by World App. Please try again.';
        category = 'rejected';
      } else if (errorCode === 'timeout') {
        message = 'Verification timed out. Please try again.';
        category = 'timeout';
      }
      
      // Credential/identity issues
      else if (errorCode === 'credential_unavailable') {
        message = 'Required World ID credential is not available. Please verify your account in World App.';
        category = 'credential';
      } else if (errorCode === 'world_id_4_not_available') {
        message = 'World ID 4.0 credential is not available. Please update your World App.';
        category = 'credential';
      } else if (errorCode === 'world_id_3_not_available') {
        message = 'World ID 3.0 credential is not available. Please contact support.';
        category = 'credential';
      }
      
      // Session/timing issues
      else if (errorCode === 'rp_signature_expired') {
        message = 'Verification session expired. Please request a new verification link from the bot.';
        category = 'expired';
      } else if (errorCode === 'timestamp_too_old' || errorCode === 'timestamp_too_far_in_future') {
        message = 'Verification session is no longer valid. Please request a new verification link.';
        category = 'timestamp';
      } else if (errorCode === 'invalid_timestamp') {
        message = 'Verification session has an invalid timestamp. Please request a new verification link.';
        category = 'timestamp';
      }
      
      // Replay/duplicate issues
      else if (errorCode === 'nullifier_replayed') {
        message = 'World ID rejected this verification request as a replay. Request a fresh verification link from the bot. If this persists, share this error code with an admin.';
        category = 'replay';
      } else if (errorCode === 'duplicate_nonce') {
        message = 'Verification session has already been used. Please request a new verification link.';
        category = 'replay';
      }
      
      // RP configuration issues
      else if (errorCode === 'invalid_rp_signature') {
        message = 'Verification configuration error. Please contact support with code: invalid_rp_signature';
        category = 'config';
      } else if (errorCode === 'unknown_rp' || errorCode === 'inactive_rp') {
        message = 'Service configuration error. Please contact support with code: ' + errorCode;
        category = 'rp';
      } else if (errorCode === 'invalid_rp_id_format') {
        message = 'Service configuration error. Please contact support with code: invalid_rp_id_format';
        category = 'config';
      }
      
      // Network/connection
      else if (errorCode === 'connection_failed') {
        message = 'Connection to World App failed. Please check your connection and try again.';
        category = 'network';
      } else if (errorCode === 'unexpected_response') {
        message = 'Unexpected response from World App. Please try again.';
        category = 'network';
      }
      
      // Rate limiting
      else if (errorCode === 'max_verifications_reached') {
        message = 'Maximum verifications reached. Please try again later.';
        category = 'rate_limit';
      }
      
      // Technical errors
      else if (errorCode === 'inclusion_proof_pending' || errorCode === 'inclusion_proof_failed') {
        message = 'Verification processing error. Please try again in a moment.';
        category = 'inclusion_proof';
      } else if (errorCode === 'malformed_request') {
        message = 'Verification request error. Please contact support with code: malformed_request';
        category = 'malformed';
      } else if (errorCode === 'invalid_network') {
        message = 'Network configuration mismatch. Please contact support with code: invalid_network';
        category = 'config';
      } else if (errorCode === 'user_presence_failed') {
        message = 'User presence check failed. Please try again.';
        category = 'presence';
      } else if (errorCode === 'failed_by_host_app') {
        message = 'Verification failed during processing. Please try again.';
        category = 'host_app';
      } else if (errorCode === 'feature_unavailable') {
        message = 'Requested feature is not available. Please contact support.';
        category = 'feature';
      } else if (errorCode === 'identity_attributes_not_matched') {
        message = 'Identity attributes did not match requirements. Please contact support.';
        category = 'identity';
      } else if (errorCode === 'generic_error') {
        message = 'An unknown error occurred. Please try again or contact support.';
        category = 'generic';
      } else if (errorCode === 'cancelled') {
        message = 'Verification was cancelled. Please try again when ready.';
        category = 'user_cancelled';
      }
      
      // Unknown error code (safely log unmapped codes)
      else {
        category = 'unmapped_' + (errorCode || 'unknown').replace(/[^a-z0-9_]/gi, '');
        message = 'Verification failed. Please try again or contact support with code: ' + errorCode;
      }
      
      // Privacy-safe structured error logging (no PII, no proof data)
      console.error('World App verification error:', {
        category: category,
        errorCode: errorCode,
        timestamp: new Date().toISOString(),
      });
      
      showError(message);
      buttonEl.disabled = false;
    }
    
    function formatExpiry(timestamp) {
      const date = new Date(timestamp * 1000);
      const days = Math.floor((date - Date.now()) / (1000 * 60 * 60 * 24));
      return days > 0 ? `in ${days} days` : 'soon';
    }
    
    // Handle dynamic viewport changes (resize, orientation, visualViewport)
    function handleViewportChange() {
      // Force layout recalculation on viewport changes
      // No-op function, but ensures CSS media queries and dvh units re-evaluate
      document.body.offsetHeight; // Trigger layout
    }
    
    // Register viewport change handlers
    if ('visualViewport' in window && window.visualViewport) {
      window.visualViewport.addEventListener('resize', handleViewportChange);
    }
    
    window.addEventListener('resize', handleViewportChange);
    window.addEventListener('orientationchange', handleViewportChange);
    
    // Initialize on page load
    initializeSession();
  </script>
