<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World ID Verification</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 420px;
      width: 100%;
      padding: 40px 30px;
      text-align: center;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 12px;
    }
    .subtitle {
      font-size: 16px;
      color: #718096;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    #status {
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 24px;
      font-size: 14px;
      line-height: 1.6;
    }
    #status.loading {
      background: #edf2f7;
      color: #4a5568;
    }
    #status.error {
      background: #fed7d7;
      color: #c53030;
    }
    #status.success {
      background: #c6f6d5;
      color: #22543d;
    }
    #status.warning {
      background: #fefcbf;
      color: #744210;
    }
    .button {
      background: #667eea;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      margin-top: 16px;
    }
    .button:hover {
      background: #5a67d8;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    .button:disabled {
      background: #cbd5e0;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .info {
      font-size: 13px;
      color: #a0aec0;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #e2e8f0;
    }
    .spinner {
      border: 3px solid #e2e8f0;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>World ID Verification</h1>
    <p class="subtitle">Verify your unique personhood to access this Telegram group</p>
    
    <div id="status" class="loading">
      <div class="spinner"></div>
      Loading verification session...
    </div>
    
    <div id="connectorDisplay" class="hidden" style="margin: 20px 0; text-align: center;">
      <div id="qrCode" style="margin: 0 auto 20px; display: inline-block; padding: 10px; background: white; border-radius: 8px;"></div>
      <p style="margin-bottom: 10px; font-size: 14px; color: #4a5568; font-weight: 600;">
        Scan QR code with World App
      </p>
      <a id="connectorLink" href="#" target="_blank" style="display: inline-block; padding: 12px 24px; background: #667eea; color: white; text-decoration: none; border-radius: 8px; font-size: 14px; font-weight: 600; margin-top: 10px;">
        Or tap to open on this device
      </a>
    </div>
    
    <button id="verifyButton" class="button hidden" disabled>
      Connect World App
    </button>
    
    <div class="info">
      <strong>Privacy:</strong> Only a zero-knowledge proof is verified. Our service receives no raw biometric data.
    </div>
  </div>

  <!-- Load Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <script type="module">
    // NO SECRETS IN CLIENT CODE
    // Configuration injected via URL params and Telegram WebApp context
    
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('session');
    
    const statusEl = document.getElementById('status');
    const buttonEl = document.getElementById('verifyButton');
    
    // Check for Telegram WebApp SDK (must be loaded before use)
    if (typeof window.Telegram === 'undefined' || !window.Telegram.WebApp) {
      showError('Telegram WebApp SDK failed to load. Please open this page in Telegram.');
      throw new Error('Telegram WebApp SDK not loaded');
    }
    
    // Check for Telegram Mini App context (required for authentication)
    const telegramWebApp = window.Telegram.WebApp;
    const initData = telegramWebApp.initData;
    
    function showStatus(message, type = 'loading') {
      statusEl.className = type;
      
      // SECURITY: Use textContent to prevent XSS, not innerHTML
      statusEl.textContent = '';
      
      if (type === 'loading') {
        const spinner = document.createElement('div');
        spinner.className = 'spinner';
        statusEl.appendChild(spinner);
      }
      
      const text = document.createTextNode(message);
      statusEl.appendChild(text);
    }
    
    function showError(message) {
      showStatus(message, 'error');
      buttonEl.classList.add('hidden');
    }
    
    function showSuccess(message) {
      showStatus(message, 'success');
      buttonEl.classList.add('hidden');
    }
    
    function showWarning(message) {
      showStatus(message, 'warning');
      buttonEl.classList.add('hidden');
    }
    
    async function initializeSession() {
      if (!sessionId) {
        showError('Invalid verification link. Please request a new one from the bot.');
        return;
      }
      
      // SECURITY: Require Telegram Mini App context (fail-closed)
      if (!initData) {
        showWarning('⚠️ This page must be opened from the Telegram bot. Verification is disabled in external browsers for security. Please open the link in Telegram.');
        return;
      }
      
      try {
        // Fetch session configuration from backend
        const response = await fetch(`/api/enrollment/session/${sessionId}`);
        
        if (!response.ok) {
          if (response.status === 404) {
            showError('Verification session not found or expired. Please request a new one.');
          } else if (response.status === 410) {
            showError('This verification session has already been used.');
          } else {
            showError('Unable to load verification session. Please try again.');
          }
          return;
        }
        
        const session = await response.json();
        
        // Validate session data
        if (!session.signedChallenge || !session.signedChallenge.action || !session.signedChallenge.nonce) {
          showError('Invalid session configuration.');
          return;
        }
        
        // Display ready state
        showStatus('Ready to verify with World App', 'success');
        buttonEl.classList.remove('hidden');
        buttonEl.disabled = false;
        
        // Store session for verification
        window.enrollmentSession = session;
        
        // Set up verification handler
        buttonEl.onclick = handleVerification;
        
      } catch (error) {
        console.error('Session initialization error:', error);
        showError('Network error. Please check your connection and try again.');
      }
    }
    
    /**
     * Generate standards-compliant QR code using bundled qrcode library
     * 
     * @param text - Data to encode (connectorURI)
     * @param container - DOM element to render into
     */
    async function generateQRCode(text, container) {
      try {
        // Import locally bundled qrcode library
        const { QRCodeLib } = await import('/qrcode-bundle.js');
        
        // Generate standards-compliant QR code
        // Settings per ISO/IEC 18004 standard:
        // - Error correction: M (15% recovery)
        // - Margin: 4 modules (standard quiet zone)
        // - Scale: 8 pixels per module (high resolution)
        const canvas = document.createElement('canvas');
        
        await QRCodeLib.toCanvas(canvas, text, {
          errorCorrectionLevel: 'M',
          margin: 4,
          scale: 8,
          width: 280,
          color: {
            dark: '#1a202c',
            light: '#ffffff'
          }
        });
        
        container.innerHTML = '';
        container.appendChild(canvas);
      } catch (error) {
        console.error('QR generation failed:', error);
        // Fallback: show clickable URL
        container.innerHTML = `<div style="padding: 20px; background: #f7fafc; border-radius: 8px;"><a href="${text}" target="_blank" style="color: #667eea; text-decoration: none; font-size: 14px; font-weight: 600;">Open World App on this device</a></div>`;
      }
    }

    async function handleVerification() {
      const session = window.enrollmentSession;
      if (!session) {
        showError('Session expired. Please request a new verification link.');
        return;
      }
      
      if (!initData) {
        showError('Telegram authentication required. Please open from the bot.');
        return;
      }
      
      buttonEl.disabled = true;
      showStatus('Connecting to World App...', 'loading');
      
      try {
        // Import locally bundled IDKit Core SDK (from installed @worldcoin/idkit-core)
        const { IDKit, proofOfHuman } = await import('/idkit-bundle.js');
        
        // Validate required fields from session (fail-closed, no synthetic fallbacks)
        if (!session.rpId) {
          showError('Invalid session: missing RP ID. Please request a new verification.');
          return;
        }
        if (!session.signedChallenge.nonce) {
          showError('Invalid session: missing nonce. Please request a new verification.');
          return;
        }
        if (!session.signedChallenge.createdAt) {
          showError('Invalid session: missing timestamp. Please request a new verification.');
          return;
        }
        if (!session.signedChallenge.expiresAt) {
          showError('Invalid session: missing expiry. Please request a new verification.');
          return;
        }
        if (!session.signedChallenge.signature) {
          showError('Invalid session: missing signature. Please request a new verification.');
          return;
        }
        
        // Extract RP context from session (signed by backend, no fallbacks)
        const rp_context = {
          rp_id: session.rpId,
          nonce: session.signedChallenge.nonce,
          created_at: session.signedChallenge.createdAt,
          expires_at: session.signedChallenge.expiresAt,
          signature: session.signedChallenge.signature,
        };
        
        // Create verification request using official IDKit API
        const request = await IDKit.request({
          app_id: session.appId,
          action: session.signedChallenge.action,
          rp_context: rp_context,
          allow_legacy_proofs: true,
        }).preset(proofOfHuman({ signal: session.signal }));
        
        // CRITICAL: Display connectorURI in tappable DOM element BEFORE polling
        if (!request.connectorURI) {
          showError('Failed to generate World App connection. Please try again.');
          buttonEl.disabled = false;
          return;
        }
        
        // Display connectorURI as QR code and link
        const connectorDisplay = document.getElementById('connectorDisplay');
        const connectorLink = document.getElementById('connectorLink');
        const qrCodeEl = document.getElementById('qrCode');
        
        // Generate QR code from connectorURI
        await generateQRCode(request.connectorURI, qrCodeEl);
        
        connectorLink.href = request.connectorURI;
        connectorDisplay.classList.remove('hidden');
        
        showStatus('Scan QR code with World App on your phone', 'success');
        buttonEl.classList.add('hidden');
        
        // Poll for completion (user taps link in parallel)
        const result = await request.pollUntilCompletion({
          pollInterval: 2000,
          timeout: 300000, // 5 minutes
        });
        
        if (result.success) {
          await handleProofReceived(result.result);
        } else {
          handleProofError(result.error);
        }
        
      } catch (error) {
        console.error('Verification error:', error);
        showError('Unable to connect to World App. Please try again.');
        buttonEl.disabled = false;
      }
    }
    
    async function handleProofReceived(result) {
      showStatus('Submitting proof for verification...', 'loading');
      
      try {
        // SECURITY: Send both initData and proof for same-requester binding
        const response = await fetch('/api/enrollment/complete', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            initData: initData,
            idkitResult: result,
          }),
        });
        
        const data = await response.json();
        
        if (response.ok && data.success) {
          showSuccess(`✓ Verification successful! You can now return to Telegram. Your enrollment expires ${formatExpiry(data.expiresAt)}.`);
        } else {
          // SECURITY: Use textContent for error messages to prevent XSS
          const errorMsg = data.error || 'Verification failed. Please try again.';
          showError(errorMsg);
          buttonEl.disabled = false;
        }
        
      } catch (error) {
        console.error('Proof submission error:', error);
        showError('Network error while submitting proof. Please try again.');
        buttonEl.disabled = false;
      }
    }
    
    function handleProofError(errorCode) {
      console.error('World App error:', errorCode);
      let message = 'World App verification failed. Please try again.';
      
      // Map specific error codes to user-friendly messages
      if (errorCode === 'user_rejected') {
        message = 'Verification was cancelled. Please try again when ready.';
      } else if (errorCode === 'verification_rejected') {
        message = 'Verification was rejected by World App. Please try again.';
      } else if (errorCode === 'credential_unavailable') {
        message = 'Required World ID credential is not available. Please verify your account in World App.';
      } else if (errorCode === 'connection_failed') {
        message = 'Connection to World App failed. Please check your connection and try again.';
      } else if (errorCode === 'timeout') {
        message = 'Verification timed out. Please try again.';
      }
      
      showError(message);
      buttonEl.disabled = false;
    }
    
    function formatExpiry(timestamp) {
      const date = new Date(timestamp * 1000);
      const days = Math.floor((date - Date.now()) / (1000 * 60 * 60 * 24));
      return days > 0 ? `in ${days} days` : 'soon';
    }
    
    // Initialize on page load
    initializeSession();
  </script>
</body>
</html>
